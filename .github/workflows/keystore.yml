name: Gerar keystore de upload

# Rode UMA vez (Actions → "Gerar keystore de upload" → Run workflow), antes do
# primeiro AAB. Gera a chave de upload do Google Play sem precisar de Java no
# computador. O artefato (vale 1 dia) traz os 3 valores para os Secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS.
# Depois de gravar os Secrets e guardar uma cópia segura, APAGUE o artefato.
# Se os Secrets já existirem, o workflow se recusa a gerar outra chave (trocar a
# chave de upload depois do 1º envio exige pedir ao Google), a menos que você
# marque "substituir".

on:
  workflow_dispatch:
    inputs:
      substituir:
        description: "Gerar mesmo já existindo uma keystore nos Secrets"
        type: boolean
        default: false

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Não sobrescrever a chave existente
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ] && [ "${{ inputs.substituir }}" != "true" ]; then
            echo "::error::Já existe ANDROID_KEYSTORE_BASE64 nos Secrets. Para gerar outra, rode de novo marcando 'substituir'."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar a keystore
        run: |
          set -e
          umask 077
          OUT="$RUNNER_TEMP/keystore-de-upload"
          mkdir -p "$OUT"
          PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$OUT/upload-keystore.jks" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" -alias upload -keyalg RSA -keysize 4096 -validity 10950 \
            -dname "CN=Fernando Martins Sampaio, O=FSamp Labs, C=BR" >/dev/null 2>&1
          keytool -exportcert -rfc -keystore "$OUT/upload-keystore.jks" -storepass "$PASS" -alias upload \
            -file "$OUT/upload_certificate.pem" >/dev/null 2>&1
          base64 -w0 "$OUT/upload-keystore.jks" > "$OUT/ANDROID_KEYSTORE_BASE64.txt"
          printf '%s' "$PASS" > "$OUT/ANDROID_KEYSTORE_PASSWORD.txt"
          printf 'upload' > "$OUT/ANDROID_KEY_ALIAS.txt"
          cat > "$OUT/LEIA-ME.txt" <<'TXT'
          Chave de upload do Google Play (Esqueletons Runs 2040).

          1. GitHub → Settings → Secrets and variables → Actions → New repository secret:
             ANDROID_KEYSTORE_BASE64   = conteúdo de ANDROID_KEYSTORE_BASE64.txt
             ANDROID_KEYSTORE_PASSWORD = conteúdo de ANDROID_KEYSTORE_PASSWORD.txt
             ANDROID_KEY_ALIAS         = upload
          2. Guarde upload-keystore.jks e a senha num lugar seguro e privado (gerenciador
             de senhas + uma cópia offline). Sem ela, trocar a chave exige pedir ao Google.
          3. Apague este artefato na página da execução (ícone de lixeira).
          upload_certificate.pem só é pedido pelo Google se um dia você precisar
          redefinir a chave de upload.
          TXT
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-de-upload-APAGUE-DEPOIS
          path: ${{ runner.temp }}/keystore-de-upload/
          retention-days: 1
