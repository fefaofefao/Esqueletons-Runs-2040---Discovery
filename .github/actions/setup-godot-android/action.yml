name: Preparar Godot + Android
description: Java 17, Android SDK (API 36), Godot e export templates, com cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools platforms;android-36 build-tools;36.0.0"

    - name: Cache do Godot e templates
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}
        key: godot-android-${{ env.GODOT_VERSION }}

    - name: Baixar Godot e export templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot ~/.local/share/godot/export_templates
        curl -fsSL --retry 4 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
        unzip -q -o /tmp/godot.zip -d ~/godot
        mv -f ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
        curl -fsSL --retry 4 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
        unzip -q -o /tmp/templates.tpz -d /tmp/tpl
        rm -rf ~/.local/share/godot/export_templates/${TEMPLATES_DIR}
        mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${TEMPLATES_DIR}
        rm -f /tmp/godot.zip /tmp/templates.tpz

    - name: Configurar editor (SDK e Java)
      shell: bash
      run: |
        mkdir -p ~/.config/godot
        for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOT
        [gd_resource type="EditorSettings" format=3]

        [resource]
        export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        export/android/java_sdk_path = "${JAVA_HOME}"
        export/android/shutdown_adb_on_exit = false
        EOT
        done
        cat ~/.config/godot/editor_settings-4.7.tres

    # O editor do Godot consulta o adb quando há SDK configurado. Se o próprio Godot
    # subir o servidor adb, o daemon herda a saída do passo e o passo nunca termina.
    # Subindo antes, desacoplado, o Godot só reutiliza o servidor existente.
    - name: Servidor adb desacoplado
      shell: bash
      run: |
        ADB="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platform-tools/adb"
        nohup "$ADB" start-server </dev/null >/dev/null 2>&1 &
        sleep 3
        "$ADB" devices </dev/null || true
